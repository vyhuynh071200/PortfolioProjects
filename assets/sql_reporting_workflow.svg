<svg xmlns="http://www.w3.org/2000/svg" width="940" height="320" viewBox="0 0 940 320" role="img" aria-labelledby="title description">
<title id="title">COVID-19 SQL portfolio workflow</title>
<desc id="description">Flow from source tables for cases and vaccinations to data quality checks, analytical SQL queries using CTEs and window functions, and a reusable reporting view. Separate SQL tests validate an isolated synthetic demo.</desc>
<style>.title{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#183450}.subtitle{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#576F84}.step{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#183450}.sub{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#5A7083}.foot{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#5C7287}</style>
